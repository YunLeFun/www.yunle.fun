name: 功能建议
description: 提出产品改进建议或技术功能需求
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。GitHub Issues 是公开渠道，请不要填写账号、订单、退款、支付凭证等隐私信息。
  - type: textarea
    id: need
    attributes:
      label: 需求背景
      description: 请说明你想解决的问题或使用场景。
      placeholder: 我希望在 ... 场景下可以 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你希望如何改进。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 可选。是否尝试过其他替代方案？
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 一般建议
        - 影响当前使用
        - 阻塞当前使用
    validations:
      required: true
