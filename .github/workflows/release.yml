name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # 从 conventional commits（feat/fix/chore…）自动生成 GitHub Release 日志。
      # 使用内置 GITHUB_TOKEN，无需额外配置密钥。
      # 触发方式：打 tag 并推送，例如 `git tag v1.0.0 && git push origin v1.0.0`。
      - name: Changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
