title: 云乐坊 [应用生态]{class="ylf-gradient-text"}
description: 先把官方应用与跨应用体验做好，再逐步开放第三方接入。
headline: ☁️ 应用生态
seo:
  title: 云乐坊应用生态
  description: 了解云乐坊官方应用、开发者文档与第三方接入开放状态
navigation: false
notice:
  title: 第三方自助发布尚未开放
  description: 当前优先打磨和上架云乐坊官方应用；开发者套餐、在线 IDE 与自助部署平台均不在近期计划内。
hero:
  links:
    - label: 浏览官方应用
      icon: i-lucide-compass
      trailing: true
      to: /explore
      size: xl
    - label: 查看开发者文档
      icon: i-lucide-book-open
      size: xl
      color: neutral
      variant: outline
      class: ylf-gradient-border
      to: https://docs.yunle.fun
      target: _blank
sections:
  - title: 当前阶段，先把第一方应用做好
    description: 云乐坊正在验证应用图谱、统一账号、会员与云币等跨应用体验。第三方接入会在边界和流程稳定后再逐步开放。
    headline: 当前重点
    orientation: vertical
    features:
      - name: 官方应用优先
        description: 先持续打磨云乐坊自研应用，确保每个入口都真实可用。
        icon: i-lucide-badge-check
      - name: 统一账号体验
        description: 让支持接入的应用复用同一套登录、安全设置与用户身份。
        icon: i-lucide-key-round
      - name: 开放边界先文档化
        description: 将应用接入、账号、支付与 SSO 的现有规范集中公开，减少模糊承诺。
        icon: i-lucide-file-check-2
features:
  headline: 已公开内容
  title: 现在可以了解什么
  description: 开发者文档记录已经明确的接入边界，不代表第三方自助发布已经开放。
  items:
    - title: 应用接入
      description: 了解应用信息、审核规范与接入准备。
      icon: i-lucide-blocks
      to: https://docs.yunle.fun/app/
      target: _blank
    - title: 统一账号与 SSO
      description: 查看跨应用登录流程、安全边界与授权说明。
      icon: i-lucide-shield-check
      to: https://docs.yunle.fun/account/sso
      target: _blank
    - title: 账号与支付
      description: 了解云币、会员及平台账户能力的公开约定。
      icon: i-lucide-wallet-cards
      to: https://docs.yunle.fun/account/
      target: _blank
resources:
  headline: 继续了解
  title: 从真实可用的入口开始
  description: 浏览已经上线的应用，或阅读公开文档与项目源码。
  items:
    - title: 云端应用图谱
      description: 查看目前已经公开的云乐坊官方应用。
      icon: i-lucide-cloud-sun
      to: /explore
    - title: 开发者文档
      description: 应用接入、账号、支付与 SSO 的统一文档入口。
      icon: i-lucide-book-open
      to: https://docs.yunle.fun
      target: _blank
    - title: GitHub
      description: 浏览云乐坊公开项目与代码仓库。
      icon: i-ri-github-fill
      to: https://github.com/YunLeFun
      target: _blank
    - title: 联系我们
      description: 需要交流接入需求时，通过官方渠道联系我们。
      icon: i-lucide-message-circle
      to: /docs/contact
cta:
  title: 先看看已经上线的应用
  description: 从真实体验出发，了解云乐坊正在构建怎样的应用生态。
  links:
    - label: 浏览应用
      to: /explore
      trailingIcon: i-lucide-arrow-right
    - label: 阅读开发者文档
      to: https://docs.yunle.fun
      target: _blank
      variant: outline
      class: ylf-gradient-border
      icon: i-lucide-book-open
