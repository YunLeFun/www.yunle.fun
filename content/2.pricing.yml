faq:
  title: 常见问题
  description: 以下是用户最常问到的问题，希望能帮助您更好地了解我们的服务。
  items:
    - label: 如何取消订阅？
      content: 您可以随时在账户设置中取消订阅。取消后，您的服务将在当前计费周期结束时停止，期间您仍可正常使用所有功能。
    - label: 你们提供退款吗？
      content: 我们提供 7 天无理由退款保障。如果您对服务不满意，可以在购买后 7 天内申请全额退款。
    - label: 你们提供技术支持吗？
      content: 我们提供技术支持。技术类问题、客诉、退款和一般咨询请查看对应联系渠道。
      to: /docs/contact
