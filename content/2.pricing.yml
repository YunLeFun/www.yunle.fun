faq:
  title: 常见问题
  description: 以下是用户最常问到的问题，希望能帮助您更好地了解我们的服务。
  items:
    - label: 会员有效期如何计算？
      content: 月付按 Asia/Shanghai 自然月计算，年付按自然年计算。首次购买日在月末时，后续周期始终在月末到期；其他日期在目标月份不存在时取该月最后一天，之后恢复原账单日。
    - label: 是否会自动续费？
      content: 不会自动续费。月付和年付均为单次购买，到期后可按需再次购买，也不会自动扣款。
    - label: 你们提供退款吗？
      content: 我们提供 7 天无理由退款保障。如果您对服务不满意，可以在购买后 7 天内申请全额退款。
    - label: 你们提供技术支持吗？
      content: 我们提供技术支持。技术类问题、客诉、退款和一般咨询请查看对应联系渠道。
      to: /docs/contact
