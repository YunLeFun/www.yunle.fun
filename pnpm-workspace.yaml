minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@yunlefun/sso@0.6.2'
  - baseline-browser-mapping@2.11.15
  - nanoid@3.3.18
  - '@yunlefun/ui@0.0.4'

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

trustPolicyExclude:
  - chokidar@4.0.3
  # Optional Oxc platform packages currently omit publish-time metadata in the
  # registry response. They remain integrity-pinned by pnpm-lock.yaml.
  - '@oxc-parser/binding-wasm32-wasi@0.140.0'
  - '@oxc-transform/binding-linux-x64-gnu@0.140.0'

shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*
# 将传递依赖固定到已修复版本，避免上游范围继续解析到有漏洞的版本。
overrides:
  '@bomb.sh/tab': 0.0.22
  '@nuxt/devtools': 3.3.1
  '@nuxt/test-utils': 'catalog:'
  '@tiptap/core': 3.30.5
  '@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/extension-code': 3.30.5
  '@tiptap/extension-collaboration': 3.30.5
  '@tiptap/extension-drag-handle': 3.30.5
  '@tiptap/extension-drag-handle-vue-3': 3.30.5
  '@tiptap/extension-floating-menu': 3.30.5
  '@tiptap/extension-horizontal-rule': 3.30.5
  '@tiptap/extension-image': 3.30.5
  '@tiptap/extension-mention': 3.30.5
  '@tiptap/extension-node-range': 3.30.5
  '@tiptap/extension-placeholder': 3.30.5
  '@tiptap/markdown': 3.30.5
  '@tiptap/pm': 3.30.5
  '@tiptap/starter-kit': 3.30.5
  '@tiptap/suggestion': 3.30.5
  '@tiptap/vue-3': 3.30.5
  devalue: 5.9.2
  fontless>esbuild: ^0.28.1
  js-yaml: 4.3.2
  minimatch>brace-expansion: 5.0.9
  nanoid: 3.3.18
  postcss: 8.5.23
  qs: 6.16.0
  svgo: 4.1.0
  undici: 8.9.0

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  core-js-pure: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@apple/app-store-server-library': ^3.1.0
  '@cloudbase/js-sdk': ^3.10.1
  '@cloudbase/node-sdk': ^3.18.3
  '@cloudbase/signature-nodejs': ^2.0.0
  '@iconify-json/lucide': ^1.2.136
  '@iconify-json/ri': ^1.2.10
  '@lucide/vue': ^1.48.0
  '@nuxt/content': ^3.15.2
  '@nuxt/eslint': ^1.17.0
  '@nuxt/icon': ^2.5.1
  '@nuxt/test-utils': ^4.3.2
  '@nuxt/ui': ^4.11.2
  '@nuxtjs/i18n': ^10.6.0
  '@nuxtjs/mdc': ^0.23.1
  '@oxc-minify/binding-linux-x64-gnu': 0.151.0
  '@oxc-parser/binding-linux-x64-gnu': 0.151.0
  '@oxc-transform/binding-linux-x64-gnu': 0.151.0
  '@rollup/plugin-yaml': ^5.0.0
  '@types/node': ^24.13.6
  '@types/qrcode': ^1.5.6
  '@vue/test-utils': ^2.5.1
  '@vueuse/core': ^15.0.0
  '@vueuse/nuxt': ^15.0.0
  '@yunlefun/sso': ^0.6.2
  '@yunlefun/types': ^0.2.1
  '@yunlefun/ui': ^0.0.4
  baseline-browser-mapping: ^2.11.25
  better-sqlite3: ^13.0.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^10.11.0
  eslint-plugin-format: ^2.0.1
  h3: ^1.15.11
  happy-dom: ^20.14.5
  nuxt: ^4.5.2
  nuxt-auth-utils: ^0.5.30
  oxc-parser: 0.151.0
  qrcode: ^1.5.4
  reka-ui: 2.10.5
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
