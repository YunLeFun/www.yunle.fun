minimumReleaseAgeExclude:
  - '@cloudbase/js-sdk@3.6.4'
  - '@iconify-json/lucide@1.2.119'
  - '@yunlefun/sso@0.6.2'
  - nanoid@3.3.17
shamefullyHoist: true

shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
packages:
  - packages/*
allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  core-js-pure: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# 顶传递依赖到已修补版本（仅 fontless 仍引入 esbuild <0.28.1，GHSA-g7r4-m6w7-qqqr）
overrides:
  '@nuxt/devtools': 3.3.1
  fontless>esbuild: ^0.28.1
  js-yaml: 4.3.1
  minimatch>brace-expansion: 5.0.9
  nanoid: 3.3.17
  postcss: 8.5.23
  undici: 8.9.0

catalog:
  '@antfu/eslint-config': ^9.2.0
  '@apple/app-store-server-library': ^3.1.0
  '@cloudbase/auth': ^3.3.13
  '@cloudbase/js-sdk': ^3.6.4
  '@cloudbase/node-sdk': latest
  '@cloudbase/signature-nodejs': ^2.0.0
  '@iconify-json/lucide': ^1.2.119
  '@iconify-json/ri': ^1.2.10
  '@lucide/vue': ^1.26.0
  '@nuxt/content': ^3.15.2
  '@nuxt/eslint': ^1.16.0
  '@nuxt/icon': ^2.3.1
  '@nuxt/test-utils': ^4.0.3
  '@nuxt/ui': ^4.10.0
  '@nuxtjs/i18n': ^10.5.0
  '@nuxtjs/mdc': ^0.22.2
  '@oxc-minify/binding-linux-x64-gnu': 0.133.0
  '@oxc-parser/binding-linux-x64-gnu': 0.133.0
  '@oxc-transform/binding-linux-x64-gnu': 0.133.0
  '@rollup/plugin-yaml': ^5.0.0
  '@types/qrcode': ^1.5.6
  '@vue/test-utils': ^2.4.11
  '@vueuse/core': ^14.3.0
  '@vueuse/nuxt': ^14.3.0
  '@yunlefun/sso': ^0.6.2
  '@yunlefun/types': ^0.2.1
  baseline-browser-mapping: ^2.11.1
